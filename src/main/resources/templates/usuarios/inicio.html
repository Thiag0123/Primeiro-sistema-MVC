<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuários - Biblioteca</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header><h1>Biblioteca</h1><nav><a th:href="@{/}">Início</a><a th:href="@{/livros}">Livros</a><a th:href="@{/autores}">Autores</a><a th:href="@{/categorias}">Categorias</a><a th:href="@{/usuarios}">Usuários</a><a th:href="@{/emprestimos}">Empréstimos</a></nav></header>
<main><h2>Usuários</h2>
<form th:if="${indiceEdicao == null}" th:object="${usuario}" th:action="@{/usuarios}" method="post" class="formulario">
<input th:field="*{nome}" placeholder="Nome" required><input th:field="*{email}" type="email" placeholder="E-mail" required><input th:field="*{matricula}" placeholder="Matrícula" required><button>Cadastrar</button></form>
<form th:if="${indiceEdicao != null}" th:object="${usuario}" th:action="@{/usuarios/editar/{indice}(indice=${indiceEdicao})}" method="post" class="formulario">
<input th:field="*{nome}" placeholder="Nome" required><input th:field="*{email}" type="email" placeholder="E-mail" required><input th:field="*{matricula}" placeholder="Matrícula" required><button>Salvar alteração</button><a th:href="@{/usuarios}" class="botao secundario">Cancelar</a></form>
<table><thead><tr><th>Nome</th><th>E-mail</th><th>Matrícula</th><th>Ações</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="4">Nenhum usuário cadastrado.</td></tr>
<tr th:each="item, status : ${usuarios}"><td th:text="${item.nome}"></td><td th:text="${item.email}"></td><td th:text="${item.matricula}"></td><td>
<a th:href="@{/usuarios/editar/{indice}(indice=${status.index})}" class="botao">Editar</a>
<form th:action="@{/usuarios/excluir/{indice}(indice=${status.index})}" method="post" class="acao"><button class="perigo">Excluir</button></form></td></tr>
</tbody></table></main></body></html>
