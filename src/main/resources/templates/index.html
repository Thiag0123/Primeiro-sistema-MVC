<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Sistema de Biblioteca</h1>
    <nav>
        <a th:href="@{/livros}">Livros</a>
        <a th:href="@{/autores}">Autores</a>
        <a th:href="@{/categorias}">Categorias</a>
        <a th:href="@{/usuarios}">Usuários</a>
        <a th:href="@{/emprestimos}">Empréstimos</a>
    </nav>
</header>
<main>
    <section class="painel">
        <h2>Área administrativa</h2>
        <p>Gerencie os registros da biblioteca.</p>
        <div class="cards">
            <a th:href="@{/livros}" class="card">Livros</a>
            <a th:href="@{/autores}" class="card">Autores</a>
            <a th:href="@{/categorias}" class="card">Categorias</a>
            <a th:href="@{/usuarios}" class="card">Usuários</a>
            <a th:href="@{/emprestimos}" class="card">Empréstimos</a>
        </div>
    </section>
</main>
</body>
</html>
